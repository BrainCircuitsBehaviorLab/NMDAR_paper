[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nmdar-paper"
version = "0.1.0"
description = "Analysis notebooks and task adapters for the NMDAR paper."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "altair>=6.1.0",
    "bottleneck>=1.6.0",
    "duckdb>=1.5.3",
    "glmhmmt==0.3.13",
    "marimo==0.23.9",
    "marimo-toml-editor>=0.1.1",
    "numexpr>=2.14.1",
    "numpy==2.4.4",
    "playwright>=1.58.0",
    "plot-saver==0.1.7",
    "sqlglot>=30.11.0",
    "statannotations>=0.7.2",
    "statsmodels>=0.14.6",
    "tensorflow-probability==0.25.0",
    "tfp-nightly==0.26.0.dev20260205",
    "tqdm>=4.67.3",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude-dependencies = ["tensorflow-probability"]

[dependency-groups]
dev = [
    "mcp>=1",
    "openai>=2.43.0",
    "pydantic>=2",
    "pytest>=9.1.1",
    "python-lsp-ruff>=2.3.1",
    "python-lsp-server>=1.14.0",
    "ruff>=0.15.12",
    "websockets>=16.0",
]


[tool.marimo.runtime]
watcher_on_save = "autorun"
