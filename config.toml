[paths]
data_dir = "./data/processed"
results_dir = "./results"

[plugins]
adapter_paths = ["./src/process"]
plot_paths = ["./src/plots"]

[palettes]
states_hex_k4 = [
    "#3853A4",   # Engaged L
    "#CC1F25",   # Engaged R
    "#817FBC",   # Disengaged L
    "#D68F9B",   # Disengaged R
]

[plot-saver]
format = "png"
default_label = "Save"
save_all_label = "Save all model plots"

[plot-saver.theme]
radius = "8px"
padding_y = "0.45rem"
padding_x = "0.9rem"
